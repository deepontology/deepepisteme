# Ruritania — places: point features with coordinates inside the deployment
# box (lon 15..17, lat 45..47). The parent names a region; the engine does not
# own regions, so a deployment that has them checks the name (see V10).

- id: place-rivertown-port
  kind: port
  name_en: "Port of Rivertown"
  name_fr: "Port de Rivertown"
